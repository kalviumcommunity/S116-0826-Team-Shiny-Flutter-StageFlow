name: stagesync
description: "A theatre production management mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core Firebase initialization
  firebase_core: ^3.12.1
  # Email/password user authentication
  firebase_auth: ^5.5.1
  # Cloud Firestore for real-time NoSQL data storage
  cloud_firestore: ^5.6.5
  # Firebase Cloud Storage for poster image uploads
  firebase_storage: ^12.4.4
  # State management using ChangeNotifier providers
  provider: ^6.1.2
  # Declarative named routing and navigation
  go_router: ^14.8.1
  # Camera and gallery image picking for posters/photos
  image_picker: ^1.1.2
  # Date/time formatting and internationalization
  intl: ^0.20.2
  # Efficient network image loading and caching
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Null-safe mocking library for unit testing services & viewmodels
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
